<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Git PR 贡献流程图</title>
  <style>
    :root {
      --bg: #f4f7f1;
      --panel: #ffffff;
      --ink: #18221a;
      --muted: #5a6b5e;
      --line: #8ca58f;
      --accent: #2f7d46;
      --accent-2: #b6d7a8;
      --warn: #f6c85f;
      --shadow: 0 12px 30px rgba(24, 34, 26, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 18% 12%, rgba(182, 215, 168, 0.6), transparent 36%),
        radial-gradient(circle at 84% 14%, rgba(246, 200, 95, 0.28), transparent 34%),
        linear-gradient(180deg, #f7fbf5 0%, var(--bg) 100%);
      color: var(--ink);
      min-height: 100vh;
      padding: 24px;
    }

    .wrap {
      max-width: 1280px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid rgba(140, 165, 143, 0.4);
      border-radius: 20px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(4px);
      overflow: hidden;
    }

    header {
      padding: 20px 24px 12px;
      border-bottom: 1px solid rgba(140, 165, 143, 0.3);
      background: linear-gradient(90deg, rgba(182, 215, 168, 0.22), rgba(246, 200, 95, 0.2));
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 2.6vw, 34px);
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .legend {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      padding: 14px 24px 0;
      color: var(--muted);
      font-size: 13px;
    }

    .chip {
      border: 1px solid rgba(47, 125, 70, 0.26);
      background: #f8fcf8;
      border-radius: 999px;
      padding: 5px 10px;
    }

    .chart {
      width: 100%;
      overflow: auto;
      padding: 8px 12px 18px;
    }

    svg {
      min-width: 1180px;
      width: 100%;
      height: auto;
      display: block;
    }

    .node {
      fill: var(--panel);
      stroke: var(--line);
      stroke-width: 2;
      filter: drop-shadow(0 8px 10px rgba(24, 34, 26, 0.08));
    }

    .node.start,
    .node.end {
      fill: #e8f4e5;
      stroke: var(--accent);
      stroke-width: 2.4;
    }

    .node.decision {
      fill: #fff8e8;
      stroke: #d6ac3f;
      stroke-width: 2.2;
    }

    .node.review {
      fill: #eef6ff;
      stroke: #6a9dd9;
    }

    .label {
      font-size: 15px;
      fill: var(--ink);
      text-anchor: middle;
      dominant-baseline: middle;
      font-weight: 600;
    }

    .small {
      font-size: 12px;
      fill: var(--muted);
      font-weight: 500;
    }

    .edge {
      stroke: #4e6952;
      stroke-width: 2;
      fill: none;
      marker-end: url(#arrow);
    }

    .edge-loop {
      stroke-dasharray: 6 5;
    }

    .edge-label {
      font-size: 12px;
      fill: #44584a;
      font-weight: 700;
      text-anchor: middle;
    }

    footer {
      border-top: 1px solid rgba(140, 165, 143, 0.3);
      padding: 10px 24px 16px;
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>Git 普通贡献者 PR 流程图</h1>
      <p class="subtitle">基于 <code>git-pr-contributor-tutorial.md</code> 提炼，覆盖 Fork -> 本地修改测试 -> 推送 -> 提 PR -> 评审迭代 -> 合并清理</p>
    </header>

    <div class="legend">
      <span class="chip">绿色：起止节点</span>
      <span class="chip">黄色：决策节点</span>
      <span class="chip">蓝色：评审阶段</span>
      <span class="chip">虚线：回环迭代</span>
    </div>

    <section class="chart" aria-label="Git PR 流程图">
      <svg viewBox="0 0 1200 1040" role="img" aria-labelledby="flow-title flow-desc">
        <title id="flow-title">Git PR 贡献流程图</title>
        <desc id="flow-desc">从准备环境到 Fork、clone、建分支、测试、提交、推送、创建 PR、处理评审、合并和清理的完整流程。</desc>

        <defs>
          <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
            <polygon points="0 0, 10 4, 0 8" fill="#4e6952"></polygon>
          </marker>
        </defs>

        <rect class="node start" x="470" y="30" width="260" height="60" rx="30"></rect>
        <text class="label" x="600" y="60">开始：准备贡献</text>

        <rect class="node" x="80" y="150" width="260" height="78" rx="14"></rect>
        <text class="label" x="210" y="182">环境检查与登录</text>
        <text class="label small" x="210" y="203">git/gh + gh auth login</text>

        <rect class="node" x="470" y="150" width="260" height="78" rx="14"></rect>
        <text class="label" x="600" y="182">Fork 官方仓库</text>
        <text class="label small" x="600" y="203">gh repo fork OWNER/REPO</text>

        <rect class="node" x="860" y="150" width="260" height="78" rx="14"></rect>
        <text class="label" x="990" y="182">Clone 你的 Fork</text>
        <text class="label small" x="990" y="203">git clone + git remote add upstream</text>

        <rect class="node" x="860" y="295" width="260" height="78" rx="14"></rect>
        <text class="label" x="990" y="327">同步主分支</text>
        <text class="label small" x="990" y="348">fetch upstream + ff-only</text>

        <rect class="node" x="860" y="440" width="260" height="78" rx="14"></rect>
        <text class="label" x="990" y="472">创建功能分支并修改</text>
        <text class="label small" x="990" y="493">git switch -c fix/xxx</text>

        <polygon class="node decision" points="990,585 1080,655 990,725 900,655"></polygon>
        <text class="label" x="990" y="646">本地测试通过？</text>
        <text class="label small" x="990" y="665">npm test / lint 等</text>

        <rect class="node" x="470" y="616" width="260" height="78" rx="14"></rect>
        <text class="label" x="600" y="648">查看改动并提交</text>
        <text class="label small" x="600" y="669">git status / add / commit</text>

        <rect class="node" x="80" y="616" width="260" height="78" rx="14"></rect>
        <text class="label" x="210" y="648">推送到 Fork 分支</text>
        <text class="label small" x="210" y="669">git push -u origin fix/xxx</text>

        <rect class="node review" x="80" y="760" width="260" height="78" rx="14"></rect>
        <text class="label" x="210" y="792">创建 PR 到 upstream</text>
        <text class="label small" x="210" y="813">gh pr create 或网页操作</text>

        <polygon class="node decision" points="600,775 690,845 600,915 510,845"></polygon>
        <text class="label" x="600" y="836">收到评审意见？</text>
        <text class="label small" x="600" y="855">review comments</text>

        <rect class="node review" x="860" y="760" width="260" height="78" rx="14"></rect>
        <text class="label" x="990" y="792">按意见修改并再 push</text>
        <text class="label small" x="990" y="813">同分支继续提交</text>

        <rect class="node end" x="470" y="950" width="260" height="60" rx="30"></rect>
        <text class="label" x="600" y="980">PR 合并后清理分支</text>

        <path class="edge" d="M600 90 L600 150"></path>
        <path class="edge" d="M470 189 L340 189"></path>
        <path class="edge" d="M730 189 L860 189"></path>
        <path class="edge" d="M990 228 L990 295"></path>
        <path class="edge" d="M990 373 L990 440"></path>
        <path class="edge" d="M990 518 L990 585"></path>

        <path class="edge" d="M900 655 L730 655"></path>
        <text class="edge-label" x="810" y="640">是</text>

        <path class="edge edge-loop" d="M1080 655 C1150 655,1150 520,1085 480"></path>
        <text class="edge-label" x="1145" y="598">否，继续修复</text>

        <path class="edge" d="M470 655 L340 655"></path>
        <path class="edge" d="M210 694 L210 760"></path>
        <path class="edge" d="M340 799 L510 845"></path>

        <path class="edge" d="M690 845 L860 799"></path>
        <text class="edge-label" x="775" y="810">是</text>

        <path class="edge edge-loop" d="M990 760 C990 700,880 700,750 730"></path>
        <text class="edge-label" x="850" y="690">回到修改/测试/提交</text>

        <path class="edge" d="M600 915 L600 950"></path>
        <text class="edge-label" x="672" y="937">否，等待合并并清理</text>
      </svg>
    </section>

    <footer>建议：打开浏览器查看此文件，并按你目标仓库把 OWNER/REPO、YOUR_NAME、fix/xxx 替换成真实值。</footer>
  </main>
</body>
</html>
