extends: default
configuration:
  pageTitle: Agent 使用笔记
  locale: zh-CN
  enableSPA: false
  enablePopovers: true
  analytics: null
  theme:
    fontOrigin: local
  contentIndex:
    enableRSS: false
  links:
    markdownLinkResolution: relative
plugins:
  - source: "@quartz-community/explorer"
    options:
      title: 主题导航
  - source: "@quartz-community/created-modified-date"
    options:
      priority: [frontmatter, filesystem]
  - source: "@quartz-community/og-image"
    enabled: false
  - source: "@quartz-community/cname"
    enabled: false
  - source: "@quartz-community/footer"
    options:
      links:
        GitHub: https://github.com/psiQAQ/psiQAQ.github.io
